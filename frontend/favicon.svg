<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="50%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff566"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)"/>
  <rect x="1.5" y="1.5" width="61" height="61" rx="14.5" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/>

  <!-- Phone Body -->
  <rect x="15" y="9" width="34" height="46" rx="7" fill="#0f172a" fill-opacity="0.75" stroke="#ffffff" stroke-width="2.5"/>

  <!-- Phone Screen Details -->
  <!-- Top Speaker / Notch -->
  <rect x="27" y="13" width="10" height="2" rx="1" fill="rgba(255,255,255,0.7)"/>

  <!-- AI Lightning Bolt -->
  <polygon points="34,18 23,33 31,33 29,45 42,30 34,30" fill="url(#boltGrad)" filter="url(#glow)"/>

  <!-- Bottom Home Indicator -->
  <rect x="26" y="50" width="12" height="1.5" rx="0.75" fill="rgba(255,255,255,0.5)"/>

  <!-- AI Sparkle 4-point star -->
  <path d="M 48 8 Q 48 13 53 13 Q 48 13 48 18 Q 48 13 43 13 Q 48 13 48 8 Z" fill="#38bdf8" />
  <circle cx="48" cy="13" r="1" fill="#ffffff" />
</svg>
