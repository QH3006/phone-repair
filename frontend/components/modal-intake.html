<!-- Modal 2: Tạo Phiếu Tiếp Nhận Thiết Bị Mới -->
<div id="intake-modal" class="modal">
    <div class="modal-content" style="max-width: 820px;">
        <div class="modal-header">
            <div>
                <h3>➕ Lập Phiếu Tiếp Nhận & Tạo Hồ Sơ Thiết Bị</h3>
                <p class="subtitle" style="margin-top:2px;">Tạo đồng bộ thông tin Khách hàng, Thiết bị và Phiếu sửa chữa mới</p>
            </div>
            <span class="close-btn" onclick="closeIntakeModal()">&times;</span>
        </div>
        
        <form id="intake-form" onsubmit="submitIntakeTicket(event)" style="overflow-y: auto; overflow-x: hidden; flex: 1 1 auto; min-height: 0; padding-right: 8px;">
            <div style="background: rgba(56, 189, 248, 0.08); border: 1px dashed var(--primary); padding: 12px 16px; border-radius: var(--radius-sm); margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;">
                <span style="font-size: 0.85rem; font-weight: 600; color: var(--primary);">⚡ Thử nghiệm nhanh với mẫu có sẵn:</span>
                <div style="display: flex; gap: 8px; flex-wrap: wrap;">
                    <button type="button" class="btn btn-outline btn-sm" onclick="fillSampleIntake('iphone')">📱 iPhone 14 Pro Max</button>
                    <button type="button" class="btn btn-outline btn-sm" onclick="fillSampleIntake('samsung')">📱 Galaxy S24 Ultra (Vẽ hình L)</button>
                    <button type="button" class="btn btn-outline btn-sm" onclick="fillSampleIntake('xiaomi')">📱 Xiaomi 13T Pro (Vẽ hình Z)</button>
                </div>
            </div>

            <!-- Khối 1: Thông tin Khách hàng -->
            <div style="margin-bottom: 20px;">
                <h4 style="font-size: 0.95rem; margin-bottom: 12px; color: var(--primary); border-bottom: 1px solid var(--border-color); padding-bottom: 6px;">
                    1. Thông Tin Khách Hàng
                </h4>
                <div class="grid-2">
                    <div class="form-group">
                        <label>Họ và tên khách hàng *</label>
                        <input type="text" id="intake-customer-name" class="form-control" placeholder="Ví dụ: Trần Văn Nam" required>
                    </div>
                    <div class="form-group">
                        <label>Số điện thoại liên hệ *</label>
                        <input type="tel" id="intake-customer-phone" class="form-control" placeholder="Ví dụ: 0912345678" required>
                    </div>
                </div>
                <div class="form-group">
                    <label>Địa chỉ khách hàng</label>
                    <input type="text" id="intake-customer-address" class="form-control" placeholder="Ví dụ: 120 Hoàng Quốc Việt, Cầu Giấy, Hà Nội">
                </div>
            </div>

            <!-- Khối 2: Thông tin Thiết bị -->
            <div style="margin-bottom: 20px;">
                <h4 style="font-size: 0.95rem; margin-bottom: 12px; color: var(--primary); border-bottom: 1px solid var(--border-color); padding-bottom: 6px;">
                    2. Thông Tin Thiết Bị Tiếp Nhận
                </h4>
                <div class="grid-2">
                    <div class="form-group">
                        <label>Hãng sản xuất *</label>
                        <select id="intake-device-brand" class="form-control" required>
                            <option value="Apple">Apple</option>
                            <option value="Samsung">Samsung</option>
                            <option value="Xiaomi">Xiaomi</option>
                            <option value="Oppo">Oppo</option>
                            <option value="Vivo">Vivo</option>
                            <option value="Asus">Asus / ROG</option>
                            <option value="Khac">Hãng khác</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Dòng máy (Model) *</label>
                        <input type="text" id="intake-device-model" class="form-control" placeholder="Ví dụ: Galaxy S24 Ultra hoặc iPhone 14 Pro Max" required>
                    </div>
                </div>
                <div class="grid-2">
                    <div class="form-group">
                        <label>Số IMEI / Serial</label>
                        <input type="text" id="intake-device-imei" class="form-control" placeholder="Ví dụ: 354892091234567">
                    </div>
                    <div class="form-group">
                        <label>Mật khẩu màn hình (PIN hoặc Vẽ mẫu hình 9 điểm)</label>
                        <input type="text" id="intake-device-pass" class="form-control" placeholder="Ví dụ: 112233 hoặc Vẽ hình: Chữ L (1-4-7-8-9)">
                        <div style="display:flex; gap:6px; flex-wrap:wrap; margin-top:6px;">
                            <span style="font-size:0.75rem; color:var(--text-muted); align-self:center;">Chọn mẫu:</span>
                            <button type="button" class="btn btn-outline btn-sm" style="padding:2px 8px; font-size:0.75rem;" onclick="setIntakePassPattern('Vẽ hình: Chữ Z (1-2-3-5-7-8-9)')">📐 Vẽ chữ Z</button>
                            <button type="button" class="btn btn-outline btn-sm" style="padding:2px 8px; font-size:0.75rem;" onclick="setIntakePassPattern('Vẽ hình: Chữ L (1-4-7-8-9)')">📐 Vẽ chữ L</button>
                            <button type="button" class="btn btn-outline btn-sm" style="padding:2px 8px; font-size:0.75rem;" onclick="setIntakePassPattern('Vẽ hình: Chữ U (1-4-7-8-9-6-3)')">📐 Vẽ chữ U</button>
                            <button type="button" class="btn btn-outline btn-sm" style="padding:2px 8px; font-size:0.75rem;" onclick="setIntakePassPattern('Không có')">🔓 Không khóa</button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Khối 3: Tình trạng lỗi & Ảnh thực tế -->
            <div style="margin-bottom: 24px;">
                <h4 style="font-size: 0.95rem; margin-bottom: 12px; color: var(--primary); border-bottom: 1px solid var(--border-color); padding-bottom: 6px;">
                    3. Tình Trạng Tiếp Nhận & Ảnh Hiện Trạng
                </h4>
                <div class="form-group">
                    <label>Mô tả hiện tượng lỗi khách báo *</label>
                    <textarea id="intake-fault-desc" class="form-control" rows="2" placeholder="Ví dụ: Rơi từ trên cao xuống, màn hình vỡ kính tối đen, cắm sạc máy nóng ran..." required></textarea>
                </div>
                <div class="grid-2">
                    <div class="form-group">
                        <label>Tình trạng ngoại quan / Ghi chú kỹ thuật sơ bộ</label>
                        <input type="text" id="intake-tech-notes" class="form-control" placeholder="Ví dụ: Viền nhôm trầy xước góc trên, nắp lưng còn nguyên">
                    </div>
                    <div class="form-group">
                        <label>Chi phí dự kiến ban đầu (VNĐ)</label>
                        <input type="number" id="intake-est-cost" class="form-control" value="0" step="50000">
                    </div>
                </div>

                <!-- Upload ảnh thiết bị -->
                <div class="form-group" style="margin-top: 10px;">
                    <label>📸 Ảnh chụp hiện trạng thiết bị:</label>
                    <div style="display:flex; gap:10px; margin-bottom: 10px; flex-wrap: wrap;">
                        <label class="btn btn-outline btn-sm" style="cursor:pointer;">
                            📁 Chọn file ảnh từ máy...
                            <input type="file" id="intake-photo-input" accept="image/*" style="display:none;" onchange="handleImageUpload(this)">
                        </label>
                        <button type="button" class="btn btn-outline btn-sm" onclick="setDemoPhoto('broken_screen')">📷 Mẫu 1: Vỡ màn hình</button>
                        <button type="button" class="btn btn-outline btn-sm" onclick="setDemoPhoto('stripe_screen')">📷 Mẫu 2: Sọc cảm ứng</button>
                        <button type="button" class="btn btn-outline btn-sm" onclick="setDemoPhoto('battery_swollen')">📷 Mẫu 3: Phồng pin</button>
                        <button type="button" class="btn btn-outline btn-sm" id="btn-clear-photo" onclick="clearPhoto()" style="display:none; color:var(--danger);">✕ Xóa ảnh</button>
                    </div>

                    <div id="photo-preview-container" style="display:none; text-align:center; padding:12px; background:var(--bg-input); border:1px solid var(--border-color); border-radius:var(--radius-sm);">
                        <img id="photo-preview-img" src="" alt="Ảnh thiết bị" style="max-height: 180px; max-width: 100%; border-radius: 6px; box-shadow: var(--shadow-sm); object-fit: contain;">
                        <p id="photo-preview-label" style="font-size: 0.78rem; color: var(--text-muted); margin-top: 6px;">Ảnh hiện trạng thiết bị khi tiếp nhận</p>
                    </div>
                </div>
            </div>

            <div style="display: flex; justify-content: flex-end; gap: 12px; border-top: 1px solid var(--border-color); padding-top: 16px;">
                <button type="button" class="btn btn-outline" onclick="closeIntakeModal()">Hủy Bỏ</button>
                <button type="submit" id="btn-submit-intake" class="btn btn-gradient" style="padding: 10px 24px;">
                    <span>💾 Lưu & Lập Phiếu Tiếp Nhận</span>
                </button>
            </div>
        </form>
    </div>
</div>
